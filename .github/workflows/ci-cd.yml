# =============================================================================
# RoamLive CI/CD Pipeline
# =============================================================================
# Automated testing, building, and deployment workflow

name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, enhancement-v2, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  CACHE_KEY: 'node-modules-${{ hashFiles("**/package-lock.json") }}'

jobs:
  # =============================================================================
  # Code Quality & Testing
  # =============================================================================
  test:
    name: 🧪 Test & Quality Checks
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roamlive_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm install --save-dev jest supertest eslint prettier
      
      - name: 🔍 Lint Code
        run: |
          npx eslint . --ext .js --ignore-path .gitignore || echo "ESLint not configured, skipping..."
      
      - name: 🎨 Check Code Formatting
        run: |
          npx prettier --check "**/*.{js,json,md}" || echo "Prettier not configured, skipping..."
      
      - name: 🔒 Security Audit
        run: npm audit --audit-level=high
      
      - name: 🧪 Run Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roamlive_test
          JWT_SECRET: test-secret-key-32-characters-long
        run: |
          # Create test database tables
          node -e "console.log('Database setup for tests would go here')"
          
          # Run tests (placeholder for when tests are added)
          echo "Tests will be implemented here"
          # npm test
      
      - name: 📊 Generate Coverage Report
        if: success()
        run: |
          echo "Coverage report generation placeholder"
          # npm run test:coverage
      
      - name: 📈 Upload Coverage
        if: success()
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # =============================================================================
  # Build & Package
  # =============================================================================
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --only=production
      
      - name: 🔨 Build Application
        run: |
          echo "Building RoamLive..."
          # Add build steps here if needed
          # npm run build
      
      - name: 🗜️ Create Build Artifact
        run: |
          mkdir -p dist
          cp -r public dist/
          cp server.js package*.json dist/
          echo "Build completed at $(date)" > dist/BUILD_INFO
      
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: roamlive-build-${{ github.sha }}
          path: dist/
          retention-days: 30

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      
      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # =============================================================================
  # Deploy to Staging
  # =============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/enhancement-v2' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://roamlive-staging.herokuapp.com
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: roamlive-build-${{ github.sha }}
          path: dist/
      
      - name: 🚀 Deploy to Heroku Staging
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "roamlive-staging"
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          branch: ${{ github.ref_name }}
      
      - name: 📧 Notify Staging Deployment
        if: success()
        run: |
          echo "Staging deployment successful!"
          echo "URL: https://roamlive-staging.herokuapp.com"

  # =============================================================================
  # Deploy to Production
  # =============================================================================
  deploy-production:
    name: 🎆 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://roamlive.herokuapp.com
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: roamlive-build-${{ github.sha }}
          path: dist/
      
      - name: 🚀 Deploy to Heroku Production
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "roamlive-prod"
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          branch: main
      
      - name: 📧 Notify Production Deployment
        if: success()
        run: |
          echo "Production deployment successful!"
          echo "URL: https://roamlive.herokuapp.com"
      
      - name: 📊 Health Check
        run: |
          sleep 30
          curl -f https://roamlive.herokuapp.com/health || echo "Health check failed"

  # =============================================================================
  # Release Management
  # =============================================================================
  release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [deploy-production]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🏷️ Generate Release Notes
        run: |
          echo "## RoamLive Release ${{ github.event.release.tag_name }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### What's New" >> RELEASE_NOTES.md
          echo "- Enhanced real-time communication" >> RELEASE_NOTES.md
          echo "- Improved location tracking" >> RELEASE_NOTES.md
          echo "- Better PWA experience" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Technical Improvements" >> RELEASE_NOTES.md
          echo "- Performance optimizations" >> RELEASE_NOTES.md
          echo "- Security enhancements" >> RELEASE_NOTES.md
          echo "- Bug fixes and stability improvements" >> RELEASE_NOTES.md
      
      - name: 📦 Package Release
        run: |
          zip -r roamlive-${{ github.event.release.tag_name }}.zip . -x "*.git*" "node_modules/*" "*.log"
      
      - name: 📎 Update Release
        uses: softprops/action-gh-release@v1
        with:
          files: roamlive-${{ github.event.release.tag_name }}.zip
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # Cleanup
  # =============================================================================
  cleanup:
    name: 🧨 Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [test, build, security]
    
    steps:
      - name: 🧨 Clean up artifacts
        run: |
          echo "Cleanup completed"
          # Add cleanup steps if needed

