<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RoamLive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Load Leaflet CSS for maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Load your app styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- MAP UI -->
  <div id="map" style="width:100vw; height:60vh;"></div>

  <!-- Sidebar/Controls (example layout, adjust as needed) -->
  <div id="sidebar">
    <label>Nickname: <input id="nickname" type="text" /></label>
    <label>Ghost Mode: <input id="ghost-mode" type="checkbox" /></label>
    <br>
    <label>My Location: <input id="my-location-button" type="checkbox" /> <span id="my-location-status">Off</span></label>
    <button id="broadcast-location-btn">Broadcast My Location</button>
    <br>
    <label>Mode:
      <select id="mode">
        <option value="person">Person</option>
        <option value="motorcycle">Motorcycle</option>
        <option value="car">Car</option>
      </select>
    </label>
    <label>Map Layer:
      <select id="map-layer">
        <option value="streets">Streets</option>
        <option value="satellite">Satellite</option>
        <option value="satellite-hybrid">Satellite with Labels</option>
      </select>
    </label>
    <br>
    <!-- AI Place Search Bar -->
    <input id="ai-search-input" placeholder="Search any place, city, landmark..." style="margin-top:8px;width:300px;" />
    <button id="ai-search-btn">Search</button>
    <div id="ai-search-result" style="display:none;padding:10px;"></div>
    <br>
    <!-- Login/Signup Forms -->
    <div id="auth-container">
      <div id="signup-form" style="display:none;">
        <h4>Sign Up</h4>
        <form>
          Username: <input id="signup-username" type="text" />
          Password: <input id="signup-password" type="password" />
          <button type="submit">Sign Up</button>
        </form>
        <div id="signup-message"></div>
        <span id="toggle-to-login" style="cursor:pointer;">Already have an account? Login</span>
      </div>
      <div id="login-form">
        <h4>Login</h4>
        <form>
          Username: <input id="login-username" type="text" />
          Password: <input id="login-password" type="password" />
          <button type="submit">Login</button>
        </form>
        <div id="login-message"></div>
        <span id="toggle-to-signup" style="cursor:pointer;">Don't have an account? Sign Up</span>
      </div>
    </div>
    <!-- More UI containers for chat, conversation list, file upload, etc. as needed -->
  </div>

  <!-- Modern Chat/Conversation UI -->
  <div id="conversations-panel" style="display:none;"></div>
  <div id="chat-window" style="display:none;"></div>
  <button id="global-chat-toggle" style="display:none;">💬</button>
  <span id="chat-unread-badge" style="display:none;"></span>

  <!-- Load Leaflet JS for maps -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Load your app JavaScript -->
  <script src="script.js"></script>
</body>
</html>
